# The options `lib/tasks/auto_annotate_models.rake` used to hand to `Annotate.set_defaults`,
# carried to the file annotaterb reads. annotaterb dropped the ENV options and the
# `set_defaults` hook, so the values are stated here rather than in a rake task.
active_admin: false
additional_file_patterns: []
position_in_routes: before
position_in_class: before
position_in_test: before
position_in_fixture: before
position_in_factory: before
position_in_serializer: before
show_foreign_keys: true
show_complete_foreign_keys: false
show_indexes: true
simple_indexes: false
model_dir: <%= Dir.glob('components/*/app/models').inspect %>
include_version: false
require: []
exclude_tests: false
exclude_fixtures: false
exclude_factories: true
exclude_serializers: false
exclude_scaffolds: true
exclude_controllers: true
exclude_helpers: true
exclude_sti_subclasses: false
ignore_model_sub_dir: false
ignore_columns: null
ignore_routes: null
ignore_unknown_models: false
hide_limit_column_types: integer,bigint,boolean
hide_default_column_types: json,jsonb,hstore
skip_on_db_migrate: false
format_markdown: false
sort: false
force: false
frozen: false
classified_sort: true
trace: false
with_comment: true
